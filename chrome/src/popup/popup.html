<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Big Browser</title>
		<link rel="stylesheet" href="theme.css" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="top">
			<svg class="mark draw" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true" focusable="false">
				<path d="M5 32C13 17.5 22 11 32 11s19 6.5 27 21c-8 14.5-17 21-27 21S13 46.5 5 32Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
				<circle cx="32" cy="32" r="11.5" fill="url(#popup-gradient)" />
				<circle cx="32" cy="32" r="4.5" fill="var(--bg-sunken)" />
				<path class="mark-cut" d="M13 53 51 11" stroke="var(--mark-bg)" stroke-width="7" stroke-linecap="round" pathLength="1" />
				<path class="mark-slash" d="M13 53 51 11" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" pathLength="1" />
				<defs>
					<linearGradient id="popup-gradient" x1="20" y1="18" x2="46" y2="48" gradientUnits="userSpaceOnUse">
						<stop stop-color="var(--blue)" />
						<stop offset="1" stop-color="var(--mint)" />
					</linearGradient>
				</defs>
			</svg>
			<h1 id="host" class="host">…</h1>
			<span id="engine-pill" class="pill">…</span>
		</header>

		<div id="engine-warning" class="notice warn" hidden></div>
		<div id="index-warning" class="notice bad" hidden></div>

		<section id="here">
			<h2 class="section-title">On this page</h2>
			<div id="plugins-here"></div>
		</section>

		<footer class="bottom">
			<button type="button" class="btn btn-ghost" id="refresh">Refresh</button>
			<button type="button" class="btn" id="options">All plugins</button>
		</footer>
		<script src="popup.js"></script>
	</body>
</html>
